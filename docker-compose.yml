services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STOCKSENSE_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - stocksense_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stocksense"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stocksense
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${STOCKSENSE_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  stocksense_postgres_data:
